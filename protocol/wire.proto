// protocol/wire.proto — the wire envelope schema (pair_request/pair_response/
// config_sync) for the desktop↔mobile WebSocket connection. Designed at
// roadmap step 7, alongside the real connection code — see
// docs/slices/07. Discovery, Pairing & Config Sync.spec.md for the full
// design rationale, the pairing sequence, and the deliberate findings this
// schema produced.
//
// profile_switch (roadmap step 10) added here — see
// docs/slices/10. Profile Switch.spec.md.

syntax = "proto3";
package buttons;

import "buttons.proto";

message Envelope {
  // "1" for this slice; bumped on breaking change
  string protocol_version = 1;
  oneof message {
    PairRequest pair_request = 2;
    PairResponse pair_response = 3;
    ConfigSync config_sync = 4;
    ButtonPress button_press = 5;
    ActionResult action_result = 6;
    // unsolicited D→M, batched — see slice 09a
    StatePush state_push = 7;
    // M→D only this slice — see slice 10 spec, Scope → Out #1
    ProfileSwitch profile_switch = 8;
  }
}

message PairRequest {
  // the QR's one-time token, OR a stored persistent auth_token
  string token = 1;
}

message PairResponse {
  bool ok = 1;
  // present iff ok — same value on every successful reconnect, no rotation (v1)
  optional string auth_token = 2;
  // present iff !ok
  optional string error = 3;
}

message ConfigSync {
  // buttons.Config from buttons.proto — the whole thing, every Profile, per
  // EDD §5.2's decision
  Config config = 1;
}

message ButtonPress {
  // the tapped button's id, nothing else this slice
  string button_id = 1;
}

message ActionResult {
  // echoed, not a request/sequence id — see slice 08 spec, Interface §
  // "Correlation"
  string button_id = 1;
  bool ok = 2;
  // present iff !ok — mirrors PairResponse
  optional string error = 3;
}

message StatePush {
  // batched — see slice 09a spec, Interface Note 1, for why repeated not
  // singular
  repeated StateChange changes = 1;
}

message StateChange {
  string button_id = 1;
  bool is_active = 2;
}

message ProfileSwitch {
  string active_profile_id = 1;
}
