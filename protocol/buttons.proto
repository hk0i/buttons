// protocol/buttons.proto — the Buttons data-model schema (Config/Profile/
// Page/Button/Action). Single source of truth for generated Rust (prost),
// Swift (swift-protobuf), and Kotlin (wire, provisional — see
// docs/01. Architecture Overview.edd.md Open Questions) types.
//
// Does NOT include the wire envelope (pair_request/config_sync/button_press/
// etc.) — that's in wire.proto, designed at roadmap step 7 alongside the
// real connection code. See
// docs/slices/07. Discovery, Pairing & Config Sync.spec.md for the wire
// design rationale, and docs/slices/06. Protobuf Codegen Prototype.spec.md
// for this schema's own design rationale and deliberate findings.

syntax = "proto3";
package buttons;

message Config {
  repeated Profile profiles = 1;
  string active_profile_id = 2;
}

message Profile {
  string id = 1;
  string name = 2;
  repeated Page pages = 3;
  // Platform-native app identifier per platform this Profile auto-switches
  // for, keyed by lowercase platform name ("macos", "windows" later).
  // Absent key = no association for that platform. See
  // docs/slices/10a. Auto Profile Switch.spec.md.
  map<string, string> associated_app_by_platform = 4;
}

message Page {
  string id = 1;
  optional string name = 2;
  repeated Button buttons = 3;
}

message Button {
  string id = 1;
  optional string label = 2;
  optional string icon = 3; // emoji/text glyph, per slice 2's convention
  // current Switch state; wire-only, never persisted on either end — see
  // desktop/src-tauri/src/switch_state.rs and slice 09 spec Interface Note 1.
  // Meaningless (always false) for a non-.switch_content button.
  bool is_active = 7;
  oneof content {           // flat numbering space with id/label/icon above —
    ActionList actions = 4; // don't restart the oneof at 1, it'd collide
    FolderContent folder = 5;
    Back back = 6;
    // named switch_content, not switch: `switch` is a reserved word in
    // Swift, and every other language's codegen would have to special-case
    // escaping it for no benefit — see slice 09 spec Interface Note 2.
    SwitchContent switch_content = 8;
  }
}
message ActionList { repeated Action actions = 1; } // doubled key on purpose — see spec finding 6
message FolderContent { repeated Button buttons = 1; } // buttons[0] is always Back
message Back {} // no payload; pops one nav level

// Two-state toggle button, capped at two states (matching Elgato's own
// "Multi Action Switch" limit) — see slice 09 spec Scope → Out #3.
message SwitchContent {
  SwitchState off = 1;
  SwitchState on = 2;
}

// Mirrors Button's own label/icon shape plus a bare actions list — no
// nested ActionList wrapper, since this isn't a oneof case competing with
// Folder/Back.
message SwitchState {
  optional string label = 1;
  optional string icon = 2;
  repeated Action actions = 3;
}

message Action {
  oneof action {
    LaunchApp launch_app = 1;
    Hotkey hotkey = 2;
    MediaKeyKind media_key = 3;
  }
}
message LaunchApp { string path = 1; }
message Hotkey { repeated string keys = 1; } // e.g. ["cmd","shift","s"]; F13-F24 by name

enum MediaKeyKind {
  MEDIA_KEY_KIND_UNSPECIFIED = 0;
  MEDIA_KEY_KIND_PLAY_PAUSE = 1;
  MEDIA_KEY_KIND_MUTE = 2;
  MEDIA_KEY_KIND_NEXT_TRACK = 3;
  MEDIA_KEY_KIND_PREVIOUS_TRACK = 4;
}
