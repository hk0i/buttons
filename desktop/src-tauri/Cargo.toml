[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.14.4"
pbjson-build = "0.7"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6.1"
tauri-plugin-dialog = "2.7.3"
prost = "0.14.4"
pbjson = "0.7"
pbjson-types = "0.7"
mdns-sd = "0.21.2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
qrcode = "0.14.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4.45"
hostname = "0.4.1"

# focus_watcher.rs (10a) — pinned to the same versions Tauri's own macOS
# backend already resolves (see Cargo.lock) to avoid a second copy of the
# Objective-C runtime bridge in the dependency tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSDictionary", "NSString", "NSOperation", "block2"] }
block2 = "0.6.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
