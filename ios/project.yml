name: Buttons
options:
  bundleIdPrefix: gg.pekk.buttons
  deploymentTarget:
    iOS: "17.0"
packages:
  # Pinned to exactly what `protoc-gen-swift --version` reports at
  # generation time (protocol/verify-swift's own rule) — the committed
  # ios/Buttons/Generated/*.pb.swift files were produced by that version;
  # don't bump without regenerating them to match. See slice 07 spec,
  # Implementation Notes #13.
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
targets:
  Buttons:
    type: application
    platform: iOS
    sources:
      - Buttons
    dependencies:
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.pekk.buttons
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6URP555BR7
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        # Camera: queryable/soft-askable, PairingView.swift pre-asks before
        # the native prompt fires — this text is that prompt's copy
        # (Implementation Notes #10.1).
        NSCameraUsageDescription: "Buttons needs your camera to scan the desktop's pairing code."
        # Local Network: not soft-askable, fires automatically on first
        # Bonjour use (Implementation Notes #10.2) — both keys required or
        # discovery silently finds nothing with no explaining error.
        NSLocalNetworkUsageDescription: "Buttons uses your local network to find and connect to the desktop app."
        NSBonjourServices:
          - _buttons._tcp
